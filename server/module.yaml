product: jvm/app

# Keeps Gradle's src/main/kotlin layout while both builds coexist (issue #58).
layout: maven-like

apply:
  - //toolchain/kotlin.module-template.yaml
  - //toolchain/lint.module-template.yaml

dependencies:
  - //core/editing
  - //core/gameplay
  # Hosted AI (C11a): the wire format, the toolbox definitions and the Koog adapter.
  - //ai
  - $libs.logback
  - $libs.ktor.serverCore
  - $libs.ktor.serverNetty
  # Accounts (C11a): SQLite through Exposed, Argon2id from Bouncy Castle, mail through Angus Mail.
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.sqlite.jdbc
  - $libs.bouncycastle.prov
  - $libs.angus.mail

test-dependencies:
  - $libs.ktor.serverTestHost

settings:
  jvm:
    mainClass: dev.spawnkit.ApplicationKt
  ktor:
    enabled: true
    version: 3.6.1 # keep aligned with ktor in gradle/libs.versions.toml


plugins:
  web-player-bundle: enabled
