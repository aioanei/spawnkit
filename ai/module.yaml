# Koog AI Studio (C7, issue #69): staged agent sessions over the operation catalog, headless rule traces, recording and
# labelled replay, and the Koog adapter. Client platforms only: Koog publishes no mingwX64 or linuxX64 artifacts.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs ]

apply:
  - //toolchain/kotlin.module-template.yaml
  - //toolchain/android.module-template.yaml
  - //toolchain/core-library.module-template.yaml
  - //toolchain/lint.module-template.yaml

dependencies:
  - //core/editing: exported
  - //core/gameplay: exported
  - $libs.kotlinx.coroutines.core: exported
  # Koog 1.3.0 (Apache-2.0, JetBrains): the live-model adapter. Each platform adds its Ktor engine below.
  - $libs.koog.anthropic: exported
  - $libs.koog.executor: exported
  - $libs.koog.httpKtor
  # HostedModel (C11a) talks to SpawnKit's server through the Ktor client that Koog already uses.
  - $libs.ktor.clientCore: exported

dependencies@jvm:
  - $libs.ktor.clientOkhttp

dependencies@android:
  - $libs.ktor.clientOkhttp

dependencies@ios:
  - $libs.ktor.clientDarwin

dependencies@web:
  - $libs.ktor.clientJs

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: dev.spawnkit.ai
