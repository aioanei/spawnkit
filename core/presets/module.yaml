product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs, mingwX64, linuxX64 ]

apply:
  - //toolchain/kotlin.module-template.yaml
  - //toolchain/android.module-template.yaml
  - //toolchain/core-library.module-template.yaml
  - //toolchain/lint.module-template.yaml

dependencies:
  - //core/editing: exported

test-dependencies:
  - //core/gameplay

settings:
  android:
    namespace: dev.spawnkit.core.presets

# Preset games (C10): presets/<id>/project.json, embedded as dev.spawnkit.presets.EmbeddedPresets.
plugins:
  embedded-templates:
    enabled: true
    directory: presets
    packageName: dev.spawnkit.presets
    objectName: EmbeddedPresets
