name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Lint (Spotless + ktlint)
        run: ./gradlew --console=plain spotlessCheck

      - name: Tests (JVM, Node.js JS/Wasm, linuxX64, Android host, server)
        run: ./gradlew --console=plain allJvmAndWebTests

      - name: Build apps (Android, desktop, web)
        run: >-
          ./gradlew --console=plain
          :app:androidApp:assembleDebug
          :app:desktopApp:compileKotlin
          :app:webApp:compileKotlinWasmJs
          :render:compileAndroidMain
          :render:compileKotlinJs
          :render:compileKotlinWasmJs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
