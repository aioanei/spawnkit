name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Lint (Spotless + ktlint)
        run: ./gradlew --console=plain spotlessCheck

      - name: Tests (JVM, Node.js JS/Wasm, linuxX64, Android host, server)
        run: ./gradlew --console=plain allJvmAndWebTests

      - name: Build apps (Android, desktop, web)
        run: >-
          ./gradlew --console=plain
          :app:androidApp:assembleDebug
          :app:desktopApp:compileKotlin
          :app:webApp:compileKotlinWasmJs
          :render:compileAndroidMain
          :render:compileKotlinJs
          :render:compileKotlinWasmJs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # Kotlin Toolchain gates (issue #58, docs/kotlin-toolchain.md). Runs alongside the Gradle `build` job, which stays
  # the required check until this job has matched its coverage on main; see the migration plan's exit criteria.
  kotlin-toolchain:
    name: kotlin-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Kotlin Toolchain distribution, JDKs, Kotlin/Native and dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'gradle/libs.versions.toml', '**/module.yaml', 'toolchain/*.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Project model
        run: ./kotlin show modules

      - name: Lint (ktlint local plugin)
        run: ./kotlin check ktlint

      - name: Build the universal player for the creator and Arcade
        run: ./kotlin build -m webPlayer

      - name: Tests (JVM, Android host, linuxX64)
        run: ./kotlin test -p jvm -p android -p linuxX64

      - name: Tests (Wasm, headless browser)
        run: ./kotlin test -p wasmJs

      - name: Build apps (Android APK, desktop, Wasm web creator)
        run: ./kotlin build -m androidApp -m desktopApp -m webApp

      - name: Package (server and desktop executable JARs, unsigned Android release bundle)
        run: ./kotlin package -m server -m desktopApp -m androidApp

      - name: Verify the same player ships in the Android creator, desktop creator and Arcade
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          tasks = Path("build/tasks")
          digests = set()
          for pattern in ("_androidApp_buildAndroidDebug/*.apk", "_desktopApp_executableJarJvm/*.jar", "_server_executableJarJvm/*.jar"):
              artifact, = tasks.glob(pattern)
              with ZipFile(artifact) as archive:
                  player, = (name for name in archive.namelist() if name.endswith("spawnkit/web-player.zip"))
                  digests.add(sha256(archive.read(player)).hexdigest())
          assert len(digests) == 1, "The creator and Arcade packages contain different players"
