name: ios

# Verifies shared code on iOS. Intentionally NOT a required check: macOS runners can queue for a long time,
# and path-filtered required checks would block unrelated pull requests.
on:
  pull_request:
    paths:
      - "core/**"
      - "samples/**"
      - "render/**"
      - "player/**"
      - "app/shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "toolchain/**"
      - "plugins/**"
      - "templates/**"
      - "**/module.yaml"
      - "project.yaml"
      - "kotlin"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    name: ios-simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: iOS simulator tests
        run: ./gradlew --console=plain iosSimulatorArm64Test

      - name: Link iOS frameworks
        run: ./gradlew --console=plain :app:shared:linkDebugFrameworkIosSimulatorArm64

      - name: iOS simulator tests (Kotlin Toolchain, issue #58)
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: ./kotlin test -p iosSimulatorArm64
