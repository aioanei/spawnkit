name: Bug report
description: Something does not work as expected
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Desktop (Windows), Desktop (macOS), Desktop (Linux), Web, Android, iOS, Server]
    validations:
      required: true
